name: Generate video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The example VRM forbids redistribution and is not committed to Git.
      # CI stays avatar-free unless you explicitly provision licensed assets.
      - name: Record real browser actions and render a 30-second demo
        env:
          VIDEO_AVATAR_ENABLED: '0'
        run: |
          mkdir -p video/output
          docker compose -f docker-compose.yml -f docker-compose.video.yml \
            up --build --abort-on-container-exit --exit-code-from video

      - name: Save MP4 and UI capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xgboost-real-ui-30s
          path: |
            video/output/video.mp4
            video/output/preview.png
            video/output/evidence.json
            video/output/intermediate/browser-ui.webm
            video/output/intermediate/narration.wav
            video/output/intermediate/narrated-without-avatar.mp4
            video/output/intermediate/avatar-green-screen.webm
            video/output/intermediate/avatar-green-screen-preview.png
            video/output/intermediate/capture-failure.png
            video/output/video_30s.mp4
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.video.yml down --remove-orphans
