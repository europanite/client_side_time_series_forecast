# Usage:
# docker compose -f docker-compose.yml -f docker-compose.video.yml \
#   up --build --abort-on-container-exit --exit-code-from video
services:
  frontend:
    # Vite 6+ otherwise may reject requests using Docker's "frontend" hostname.
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: frontend

  video:
    build:
      context: ./video
      dockerfile: Dockerfile
    depends_on:
      - frontend
    environment:
      # Use the local, actual application by default (no external website needed).
      APP_URL: ${VIDEO_APP_URL:-http://frontend:5173/client_side_time_series_forecast/}
      INPUT_CSV: /repo/data/sample_data.csv
      OUTPUT_DIR: /out
      TARGET_COLUMN: ${VIDEO_TARGET_COLUMN:-ITEM_A}
      VIDEO_CAPTURE_MODE: ${VIDEO_CAPTURE_MODE:-continuous}
      VIDEO_VOICE_ENABLED: ${VIDEO_VOICE_ENABLED:-1}
      VIDEO_VOICE: ${VIDEO_VOICE:-en_US-lessac-medium}
      VIDEO_VOICE_DIR: /voices
      VIDEO_AVATAR_ENABLED: ${VIDEO_AVATAR_ENABLED:-1}
      VIDEO_AVATAR_PATH: /video/avatars-data/avatar.vrm
      # Avoid root-owned padlock icons in the host's file manager.
      VIDEO_HOST_UID: ${LOCAL_UID:-1000}
      VIDEO_HOST_GID: ${LOCAL_GID:-1000}
    volumes:
      - ./data:/repo/data:ro
      - ./video/output:/out
      # Keep source/bundle from the Docker image. Mount ONLY the local avatar files separately.
      - ./video/avatar:/video/avatars-data:ro
      - piper_voices:/voices
    # Chromium's shared memory is much smaller with Docker's default setting.
    shm_size: 1gb

volumes:
  piper_voices:
